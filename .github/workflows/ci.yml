name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli@0.90.0
      - name: Test
        env:
          DEVCONTAINERS_INTEGRATION: "1"
          DEVCONTAINERS_RUNTIME: ${{ matrix.runtime }}
        run: dotnet test tests/DevContainers.Core.Tests/DevContainers.Core.Tests.csproj --logger "console;verbosity=normal"
      - name: Build samples
        if: matrix.runtime == 'docker'
        run: |
          dotnet build samples/dotnet-console/HelloContainer.slnx
          dotnet build samples/dotnet-webapi/HelloApi.slnx

  run-sample:
    name: Run sample API in its dev container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli@0.90.0
      - name: Start HelloApi with the Dev Container launch profile's script
        working-directory: samples/dotnet-webapi/HelloApi
        run: |
          # A user secret on the host, which the launcher copies into the container.
          dotnet user-secrets set HelloApi:Greeting "hello from the host"
          nohup pwsh -NoProfile -File ../.devcontainer/vs-run.ps1 -LaunchProfile http > "$RUNNER_TEMP/run.log" 2>&1 &
          # Only Visual Studio and VS Code forward ports, so ask from inside the container.
          for i in $(seq 1 150); do
            id=$(docker ps -q --filter label=devcontainer.local_folder | head -n 1)
            if [ -n "$id" ] && docker exec "$id" curl -sf http://localhost:5080/api/info > "$RUNNER_TEMP/info.json"; then break; fi
            sleep 4
          done
          cat "$RUNNER_TEMP/run.log"
          cat "$RUNNER_TEMP/info.json"
          grep -q '"inContainer":true' "$RUNNER_TEMP/info.json"
          grep -q '"greeting":"hello from the host"' "$RUNNER_TEMP/info.json"
          # The profile's localhost URL listens on every interface in the container, so a forwarded port reaches it.
          docker exec "$id" sh -c 'curl -sf http://$(hostname -i):5080/api/info'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Run a worker service and a Blazor app made from the project templates
        working-directory: samples/dotnet-console
        run: |
          dotnet new worker -n HelloWorker -o HelloWorker
          dotnet new blazor -n HelloBlazor -o HelloBlazor
          (cd HelloWorker && nohup pwsh -NoProfile -File ../.devcontainer/vs-run.ps1 -LaunchProfile HelloWorker > "$RUNNER_TEMP/worker.log" 2>&1 &)
          for i in $(seq 1 150); do grep -q "Worker running at" "$RUNNER_TEMP/worker.log" && break; sleep 4; done
          cat "$RUNNER_TEMP/worker.log"
          grep -q "Worker running at" "$RUNNER_TEMP/worker.log"

          # The Blazor template's profile listens on localhost:<random port>.
          port=$(jq -r '.profiles.http.applicationUrl' HelloBlazor/Properties/launchSettings.json | sed 's#.*:##')
          (cd HelloBlazor && nohup pwsh -NoProfile -File ../.devcontainer/vs-run.ps1 -LaunchProfile http > "$RUNNER_TEMP/blazor.log" 2>&1 &)
          for i in $(seq 1 150); do
            id=$(docker ps -q --filter "label=devcontainer.local_folder=$PWD" | head -n 1)
            if [ -n "$id" ] && docker exec "$id" sh -c "curl -sf http://\$(hostname -i):$port/" > "$RUNNER_TEMP/blazor.html"; then break; fi
            sleep 4
          done
          cat "$RUNNER_TEMP/blazor.log"
          grep -q "<title>Home</title>" "$RUNNER_TEMP/blazor.html"
      - name: Run and debug the TypeScript sample's npm scripts
        working-directory: samples/typescript-node
        run: |
          # The inspector mode runs the predev script (tsc) without the inspector, then the server with it.
          nohup pwsh -NoProfile -File .devcontainer/vs-run.ps1 -Npm dev -InspectPort 9229 > "$RUNNER_TEMP/node.log" 2>&1 &
          for i in $(seq 1 150); do
            id=$(docker ps -q --filter "label=devcontainer.local_folder=$PWD" | head -n 1)
            if [ -n "$id" ] && docker exec "$id" curl -sf http://localhost:3000/api/info > "$RUNNER_TEMP/node.json"; then break; fi
            sleep 4
          done
          cat "$RUNNER_TEMP/node.log"
          cat "$RUNNER_TEMP/node.json"
          grep -q '"inContainer":true' "$RUNNER_TEMP/node.json"
          grep -q '"inspector":"ws://0.0.0.0:9229/' "$RUNNER_TEMP/node.json"
          # node_modules was installed by the container's npm, into the volume, not into the folder from the host.
          test -z "$(ls -A node_modules 2>/dev/null)"
          modules=$(docker inspect -f '{{range .Mounts}}{{if eq .Type "volume"}}{{.Destination}}{{end}}{{end}}' "$id")
          echo "node_modules volume: $modules"
          docker exec "$id" test -x "$modules/.bin/tsc"
          # What the extension's port detection reads: both the app and the inspector listen.
          docker exec "$id" cat /proc/net/tcp /proc/net/tcp6 | awk '$4 == "0A" { print $2 }' | tee "$RUNNER_TEMP/listen.txt"
          grep -q ':0BB8$' "$RUNNER_TEMP/listen.txt"
          grep -q ':240D$' "$RUNNER_TEMP/listen.txt"

  vsix:
    name: Build VSIX
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: The version has a changelog section
        shell: pwsh
        run: |
          $version = ([xml] (Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.VersionPrefix | Where-Object { $_ } | Select-Object -First 1
          if (-not (& ./build/Get-ChangelogSection.ps1 -Version $version)) { throw "CHANGELOG.md has no section '## [$version]' for VersionPrefix $version." }
          "Version $version"
      - name: Build
        run: msbuild VsDevContainers.slnx /restore /p:Configuration=Release /v:minimal
      - name: Unit tests
        run: dotnet test tests/DevContainers.Core.Tests/DevContainers.Core.Tests.csproj -c Release --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: DevContainers.VisualStudio.vsix
          path: src/DevContainers.VisualStudio/bin/Release/**/*.vsix
          if-no-files-found: error
